team: my-team
description: TeamAI shared resources
repo: https://github.com/gshappy365/teamai.git
provider: github
sharing:
  rules:
    enforced: [code-review-guide]
  docs:
    localDir: ~/.teamai/docs
  env:
    injectShellProfile: true
  recall:
    enabled: true
  coAuthor:
    enabled: true
  contributeHint:
    enabled: true
  webhooks:
    enabled: true
    endpoints: [] # 待配置：type: json|feishu|wecom, url, events(如 ["*"]), secret(可选)
usageReport: false
# 注意：toolPaths 一旦出现就整体替换 CLI 内置默认表，不会与默认值合并。
# 因此这里必须写全需要保留的端（内容对齐 teamai-cli 0.27.0 默认值）。
toolPaths:
  claude:
    skills: .claude/skills
    rules: .claude/rules
    settings: .claude/settings.json
    claudemd: .claude/CLAUDE.md
    agents: .claude/agents
    mcp: .claude.json
    mcpProject: .mcp.json
  codex:
    skills: .codex/skills
    settings: .codex/hooks.json
    agents: .codex/agents
    mcp: .codex/config.toml
    mcpProject: .codex/config.toml
    userScope:
      claudemd: .codex/AGENTS.md
  workbuddy:
    skills: .workbuddy/skills
    rules: .codebuddy/rules
    settings: .workbuddy/settings.json
    claudemd: AGENTS.md
    agents: .workbuddy/agents
    mcp: .workbuddy/mcp.json
    mcpProject: .workbuddy/mcp.json
    userScope:
      rules: .workbuddy/rules
  # 自定义端：Manus 从 ~/.manus/user-skills 读取用户投递的 SKILL.md
  manus:
    skills: .manus/user-skills
  # Gemini CLI（teamai 端 id: agy）。skills 也可从 ~/.agents/skills 读，
  # 但那里混着其他工具的副本，只投官方首选的 ~/.gemini/config/skills。
  agy:
    skills: .gemini/config/skills
    rules: .gemini/config/rules
    agents: .gemini/config/agents
    mcp: .gemini/config/mcp_config.json
  # DeepSeek Harness（teamai 端 id: dsh）。home 可被 DSH_HOME 重定位，本机未设。
  dsh:
    skills: .dsh/skills
    claudemd: .dsh/AGENTS.md
    mcp: .dsh/cordis.patch.yml
sources:
  - name: gshappy365
    repo: https://github.com/gshappy365/skills
  - name: pstack
    repo: gshappy365/pstack
  - name: wigolo
    repo: https://github.com/gshappy365/wigolo
